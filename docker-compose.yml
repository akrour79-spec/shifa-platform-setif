version: '3.8'

services:
  shifa-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shifa_platform_app
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CHARGILY_SECRET_KEY=${CHARGILY_SECRET_KEY}
      - CHARGILY_MODE=${CHARGILY_MODE:-live}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
