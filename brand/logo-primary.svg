<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="shifaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="28" y="28" width="144" height="144" rx="36"/>
    </clipPath>
  </defs>
  <!-- الشعار: هلال + نبض قلب — هوية إسلامية طبية بلا صليب -->
  <g>
    <rect x="28" y="28" width="144" height="144" rx="36" fill="url(#shifaGrad)"/>
    <rect x="28" y="28" width="144" height="144" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5"/>
    <g clip-path="url(#badgeClip)">
      <!-- هلال -->
      <circle cx="100" cy="100" r="52" fill="#ffffff"/>
      <circle cx="118" cy="88" r="44" fill="url(#shifaGrad)"/>
      <!-- نبض القلب يعبر الهلال -->
      <path d="M 44 118 l 16 -16 l 11 24 l 15 -36 l 11 28 l 9 -14 l 14 14"
            fill="none" stroke="#ffffff" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- اسم المنصة -->
  <text x="200" y="110" font-family="'Cairo','Tajawal','Segoe UI',sans-serif" font-weight="900" font-size="74" fill="#0f172a">شِفَاء</text>
  <text x="204" y="154" font-family="'Cairo','Tajawal','Segoe UI',sans-serif" font-weight="600" font-size="30" fill="#059669" letter-spacing="10">سَطِيف</text>
</svg>
